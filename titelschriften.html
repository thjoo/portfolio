<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titelschriften-Vergleich</title>
    <!-- Nur zum Vergleichen (wird nicht gebaut): schwere Titelschriften zur Handschrift Covered By Your Grace -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap"
      rel="stylesheet"
    />
    <!-- Fontshare (Indian Type Foundry): frei, auch kommerziell -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=nippo@500,700&f[]=tanker@400&f[]=melodrama@700&f[]=gambarino@400&f[]=telma@700&f[]=bonny@700&f[]=chubbo@700&f[]=boska@700&f[]=zodiak@700&f[]=erode@700&f[]=kola@400&f[]=rowan@700&display=swap"
      rel="stylesheet"
    />
    <!-- Fontsource: Bagnard (Sébastien Sanfilippo, frei) -->
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/bagnard@5.1.0/index.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 3rem 5vw 5rem;
        background: #4a38b0;
        color: #f4f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        max-width: 46rem;
        margin-bottom: 2.5rem;
        color: rgba(244, 240, 255, 0.72);
        line-height: 1.5;
      }
      header h1 {
        margin: 0 0 0.5rem;
        color: #f4f0ff;
        font-size: 1.4rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30rem, 1fr));
        gap: 2.5rem;
      }
      /* Kleine Bühne: Titel hinten, Erde (Kreis) davor, Handschrift unten links */
      .stage {
        position: relative;
        height: 19rem;
        overflow: hidden;
        border-radius: 0.5rem;
        background: radial-gradient(circle at 70% 30%, #5d4cc4, #4a38b0 60%, #36288a);
      }
      .label {
        position: absolute;
        top: 0.6rem;
        right: 0.8rem;
        z-index: 3;
        font-size: 0.8rem;
        color: rgba(244, 240, 255, 0.75);
      }
      .title {
        position: absolute;
        left: 1.2rem;
        top: 1.4rem;
        z-index: 1;
        margin: 0;
        font-size: 4.6rem;
        line-height: 0.9;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .earth {
        position: absolute;
        right: 2rem;
        top: 3.5rem;
        z-index: 2;
        width: 14rem;
        height: 14rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #8f98ff, #5a55d6 45%, #36318a 80%);
        box-shadow: inset -1.5rem -1rem 2.5rem rgba(20, 14, 60, 0.6);
      }
      .text {
        position: absolute;
        left: 1.2rem;
        bottom: 1rem;
        z-index: 3;
        max-width: 15rem;
        margin: 0;
        font-family: "Covered By Your Grace", cursive;
        font-size: 1.25rem;
        line-height: 1.3;
        text-shadow: 0 1px 10px rgba(18, 12, 56, 0.6);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Titelschriften zur Handschrift</h1>
      Der Titel liegt hinter der Erde, der Text in Handschrift unten links. Dritte Auswahl: eigenständige freie Schriften
      von Fontshare und Fontsource, abseits der üblichen Google Fonts.
    </header>
    <main class="grid" id="grid"></main>
    <script>
      // Dritte Auswahl: eigenständige Schriften von Fontshare und Fontsource, abseits der üblichen Google Fonts
      const fonts = [
        ["Nippo", "geometrisch wie Futura, aber mit mehr Eigenheit", "700"],
        ["Nippo", "dieselbe, Medium", "500"],
        ["Tanker", "schmal und kräftig, wie mit dem Pinsel gemalt", "400"],
        ["Melodrama", "schmale Serife, Plakat und Buchtitel", "700"],
        ["Gambarino", "weiche, verspielte Serife", "400"],
        ["Bagnard", "kantige Serife mit Handwerk-Charakter", "400"],
        ["Erode", "warme Serife, ruhig", "700"],
        ["Zodiak", "kräftige Buchserife", "700"],
        ["Boska", "Serife mit starken Kontrasten", "700"],
        ["Telma", "rund und eigenwillig", "700"],
        ["Bonny", "rund und fett, freundlich", "700"],
        ["Chubbo", "gedrungen und fröhlich", "700"],
        ["Kola", "verspielte Plakatschrift", "400"],
        ["Rowan", "markante Serife", "700"],
      ];
      const grid = document.getElementById("grid");
      fonts.forEach(([name, note, weight], i) => {
        const el = document.createElement("div");
        el.className = "stage";
        el.innerHTML = `
          <span class="label">${i + 1}. ${name} – ${note}</span>
          <h2 class="title" style="font-family: '${name}', sans-serif; font-weight: ${weight}">3. Klasse</h2>
          <div class="earth"></div>
          <p class="text">Themen und Skripte: Höhenstufen, Flüsse und Gewässer, Klimazonen.</p>`;
        grid.appendChild(el);
      });
    </script>
  </body>
</html>
