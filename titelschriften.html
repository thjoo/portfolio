<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titelschriften-Vergleich</title>
    <!-- Nur zum Vergleichen (wird nicht gebaut): schwere Titelschriften zur Handschrift Covered By Your Grace -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap"
      rel="stylesheet"
    />
    <!-- Velvetyne (frei, OFL): Vorschau-Dateien in public/preview-fonts, nicht im Repo -->
    <style>
      @font-face { font-family: "Basteleur"; src: url("/preview-fonts/basteleur/Basteleur-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "Basteleur Moonlight"; src: url("/preview-fonts/basteleur/Basteleur-Moonlight.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Avara"; src: url("/preview-fonts/avara/Avara-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "Avara Black"; src: url("/preview-fonts/avara/Avara-Black.woff2") format("woff2"); font-weight: 900; font-display: swap; }
      @font-face { font-family: "Ouroboros"; src: url("/preview-fonts/ouroboros/Ouroboros-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Compagnon"; src: url("/preview-fonts/compagnon/Compagnon-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "Gulax"; src: url("/preview-fonts/gulax/Gulax-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Mourier"; src: url("/preview-fonts/mourier/Mourier-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Kaeru Kaeru"; src: url("/preview-fonts/kaerukaeru/kaerukaeru-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Happy Times"; src: url("/preview-fonts/happy-times/happy-times-NG_bold_master_web.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    </style>
    <style>
      body {
        margin: 0;
        padding: 3rem 5vw 5rem;
        background: #4a38b0;
        color: #f4f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        max-width: 46rem;
        margin-bottom: 2.5rem;
        color: rgba(244, 240, 255, 0.72);
        line-height: 1.5;
      }
      header h1 {
        margin: 0 0 0.5rem;
        color: #f4f0ff;
        font-size: 1.4rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30rem, 1fr));
        gap: 2.5rem;
      }
      /* Kleine Bühne: Titel hinten, Erde (Kreis) davor, Handschrift unten links */
      .stage {
        position: relative;
        height: 19rem;
        overflow: hidden;
        border-radius: 0.5rem;
        background: radial-gradient(circle at 70% 30%, #5d4cc4, #4a38b0 60%, #36288a);
      }
      .label {
        position: absolute;
        top: 0.6rem;
        right: 0.8rem;
        z-index: 3;
        font-size: 0.8rem;
        color: rgba(244, 240, 255, 0.75);
      }
      .title {
        position: absolute;
        left: 1.2rem;
        top: 1.4rem;
        z-index: 1;
        margin: 0;
        font-size: 4.6rem;
        line-height: 0.9;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .earth {
        position: absolute;
        right: 2rem;
        top: 3.5rem;
        z-index: 2;
        width: 14rem;
        height: 14rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #8f98ff, #5a55d6 45%, #36318a 80%);
        box-shadow: inset -1.5rem -1rem 2.5rem rgba(20, 14, 60, 0.6);
      }
      .text {
        position: absolute;
        left: 1.2rem;
        bottom: 1rem;
        z-index: 3;
        max-width: 15rem;
        margin: 0;
        font-family: "Covered By Your Grace", cursive;
        font-size: 1.25rem;
        line-height: 1.3;
        text-shadow: 0 1px 10px rgba(18, 12, 56, 0.6);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Titelschriften zur Handschrift</h1>
      Der Titel liegt hinter der Erde, der Text in Handschrift unten links. Vierte Auswahl: Velvetyne, eine Schriftgiesserei
      für freie, sehr eigenständige Schriften.
    </header>
    <main class="grid" id="grid"></main>
    <script>
      // Vierte Auswahl: Velvetyne (freie, sehr eigenständige Schriften, OFL)
      const fonts = [
        ["Basteleur", "von Hand geschnittene Serife, leicht unregelmässig (Bold)", "700"],
        ["Basteleur Moonlight", "dieselbe, feiner und heller", "400"],
        ["Avara", "kantige Serife mit Ecken und Kerben (Bold)", "700"],
        ["Avara Black", "dieselbe, schwer", "900"],
        ["Ouroboros", "verspielt, wie aus einem alten Kinderbuch", "400"],
        ["Compagnon", "Schreibmaschine mit Charakter (Bold)", "700"],
        ["Gulax", "eigenwillig, organisch, wie gewachsen", "400"],
        ["Mourier", "schwungvolle, kontrastreiche Display-Schrift", "400"],
        ["Kaeru Kaeru", "rund und weich, fröhlich", "400"],
        ["Happy Times", "klassische Serife mit eigenwilligen Formen (Bold)", "700"],
      ];
      const grid = document.getElementById("grid");
      fonts.forEach(([name, note, weight], i) => {
        const el = document.createElement("div");
        el.className = "stage";
        el.innerHTML = `
          <span class="label">${i + 1}. ${name} – ${note}</span>
          <h2 class="title" style="font-family: '${name}', sans-serif; font-weight: ${weight}">3. Klasse</h2>
          <div class="earth"></div>
          <p class="text">Themen und Skripte: Höhenstufen, Flüsse und Gewässer, Klimazonen.</p>`;
        grid.appendChild(el);
      });
    </script>
  </body>
</html>
