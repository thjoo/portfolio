<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titelschriften-Vergleich</title>
    <!-- Nur zum Vergleichen (wird nicht gebaut): schwere Titelschriften zur Handschrift Covered By Your Grace -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=League+Spartan:wght@500;700;800&family=Covered+By+Your+Grace&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 3rem 5vw 5rem;
        background: #4a38b0;
        color: #f4f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        max-width: 46rem;
        margin-bottom: 2.5rem;
        color: rgba(244, 240, 255, 0.72);
        line-height: 1.5;
      }
      header h1 {
        margin: 0 0 0.5rem;
        color: #f4f0ff;
        font-size: 1.4rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(30rem, 1fr));
        gap: 2.5rem;
      }
      /* Kleine Bühne: Titel hinten, Erde (Kreis) davor, Handschrift unten links */
      .stage {
        position: relative;
        height: 19rem;
        overflow: hidden;
        border-radius: 0.5rem;
        background: radial-gradient(circle at 70% 30%, #5d4cc4, #4a38b0 60%, #36288a);
      }
      .label {
        position: absolute;
        top: 0.6rem;
        right: 0.8rem;
        z-index: 3;
        font-size: 0.8rem;
        color: rgba(244, 240, 255, 0.75);
      }
      .title {
        position: absolute;
        left: 1.2rem;
        top: 1.4rem;
        z-index: 1;
        margin: 0;
        font-size: 4.6rem;
        line-height: 0.9;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .earth {
        position: absolute;
        right: 2rem;
        top: 3.5rem;
        z-index: 2;
        width: 14rem;
        height: 14rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #8f98ff, #5a55d6 45%, #36318a 80%);
        box-shadow: inset -1.5rem -1rem 2.5rem rgba(20, 14, 60, 0.6);
      }
      .text {
        position: absolute;
        left: 1.2rem;
        bottom: 1rem;
        z-index: 3;
        max-width: 15rem;
        margin: 0;
        font-family: "Covered By Your Grace", cursive;
        font-size: 1.25rem;
        line-height: 1.3;
        text-shadow: 0 1px 10px rgba(18, 12, 56, 0.6);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Titelschriften zur Handschrift</h1>
      Der Titel liegt hinter der Erde, der Text in Handschrift unten links. Futura und freie Futura-ähnliche Schriften in
      verschiedenen Stärken.
    </header>
    <main class="grid" id="grid"></main>
    <script>
      // Futura ist auf dem Mac installiert (lokal sichtbar); fürs Web bräuchte sie eine Lizenz.
      // Jost und League Spartan sind freie, Futura-ähnliche Schriften (Google Fonts)
      const fonts = [
        ["Futura", "Original (Mac), Medium", "500"],
        ["Futura", "Original (Mac), Bold", "700"],
        ["Futura", "Original (Mac), Condensed ExtraBold", "800", "condensed"],
        ["Jost", "frei, sehr nah an Futura, Medium", "500"],
        ["Jost", "frei, Bold", "700"],
        ["Jost", "frei, ExtraBold", "800"],
        ["League Spartan", "frei, Futura-ähnlich, etwas kräftiger, Medium", "500"],
        ["League Spartan", "frei, Bold", "700"],
      ];
      const grid = document.getElementById("grid");
      fonts.forEach(([name, note, weight, stretch], i) => {
        const el = document.createElement("div");
        el.className = "stage";
        el.innerHTML = `
          <span class="label">${i + 1}. ${name} – ${note}</span>
          <h2 class="title" style="font-family: '${name}', sans-serif; font-weight: ${weight}; font-stretch: ${stretch || "normal"}; ${stretch ? "font-family: 'Futura Condensed ExtraBold', Futura, sans-serif;" : ""}">3. Klasse</h2>
          <div class="earth"></div>
          <p class="text">Themen und Skripte: Höhenstufen, Flüsse und Gewässer, Klimazonen.</p>`;
        grid.appendChild(el);
      });
    </script>
  </body>
</html>
